<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support Your Department | Inter-Dept Sports Meet 2026</title>
  <meta name="description"
    content="Support your department in the Inter-Department Sports Meet 2026. Fill out the form and cheer for your team!">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Ambient backdrop blur for wider desktop displays -->
  <div class="ambient-backdrop" aria-hidden="true"></div>

  <!-- Background container with top-to-bottom progressive reveal -->
  <main class="viewport-stage" id="viewportStage">
    <div class="bg-reveal-wrapper" id="bgRevealWrapper">
      <img src="assests/img.png" alt="Inter-Department Sports Meet Poster" class="sports-bg-img" id="sportsBgImg"
        loading="eager" decoding="sync" />
      <!-- Dynamic laser scanline following the reveal edge -->
      <div class="reveal-scanline" id="revealScanline" aria-hidden="true"></div>
    </div>
  </main>

  <!-- Floating Call to Action Header Container -->
  <header class="cta-top-container" id="ctaTopContainer">
    <a href="https://forms.gle/DBssncGSuN6az11z9" target="_blank" rel="noopener noreferrer" class="support-btn"
      id="supportDeptBtn" aria-label="Support Your Department - opens Google Form in a new tab">
      <!-- Glowing aura & sonar breathing ring -->
      <span class="sonar-ring" aria-hidden="true"></span>
      <span class="shimmer-sweep" aria-hidden="true"></span>

      <!-- Sports flame/cheer icon -->
      <span class="btn-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
          stroke-linejoin="round">
          <path
            d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z" />
        </svg>
      </span>

      <span class="btn-text">Support Your Department</span>

      <!-- External arrow icon -->
      <span class="btn-arrow" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
          stroke-linejoin="round">
          <line x1="7" y1="17" x2="17" y2="7"></line>
          <polyline points="7 7 17 7 17 17"></polyline>
        </svg>
      </span>
    </a>
  </header>

  <script src="script.js"></script>
</body>

</html>
